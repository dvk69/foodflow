name: FoodFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install duckdb fastapi uvicorn pytest anthropic email-validator scipy numpy

    - name: Ingest Raw Data & Initialize DuckDB
      run: |
        python src/pipeline/generate_telemetry.py || python ingestion_service/ingest.py || true

    - name: Run Pytest Test Suite
      run: |
        python -m pytest tests/ -v

    - name: Verify API Service Health
      run: |
        python -c "from recommendation_service.main import app; print('FastAPI ASGI App successfully initialized!')"